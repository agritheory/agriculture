[project]
name = "agriculture"
description = "Agriculture"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = [ "version",]
[[project.authors]]
name = "AgriTheory"
email = "support@agritheory.dev"

[build-system]
requires = [ "flit_core >=3.4,<4",]
build-backend = "flit_core.buildapi"

[tool.black]
line-length = 99

[tool.codespell]
skip = "CHANGELOG.md|yarn.lock"

[tool.semantic_release]
assets = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = true
tag_format = "v{version}"
version_variables = [ "agriculture/__init__.py:__version__",]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=15.0.0 <16.0.0"

[tool.bench.dev-dependencies]
pytest = "~=8.2.2"
pytest-cov = "~=5.0.0"
pytest-order = "~=1.2.1"
mypy = "~=1.10.0"

[tool.pytest.ini_options]
addopts = "-s --disable-warnings"

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [ "build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test",]
minor_tags = [ "feat",]
patch_tags = [ "fix", "perf",]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.publish]
dist_glob_patterns = [ "dist/*",]
upload_to_vcs_release = true

[tool.semantic_release.branches.version]
match = "version-(15|16)"
prerelease = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"
